[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fuju-rsi"
version = "0.1.0"
description = "Local agent improvement experiments and independent verification"
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
dependencies = []

[project.optional-dependencies]
trace = ["fuju-trace[sqlite]>=0.1.10,<0.2"]

[project.scripts]
fuju-rsi = "fuju_rsi.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fuju_rsi"]
